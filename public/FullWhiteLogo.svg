
<svg xmlns="http://www.w3.org/2000/svg"
     width="928"
     height="216"
     viewBox="0 0 928 216">

  <!-- Background -->
  <rect width="928" height="216" fill="#FFFFFF"/>

  <!-- Logo Icon: 3x3 Colorful Dots -->
  <g>
    <!-- Top Row -->
    <circle cx="62" cy="85" r="19" fill="#0878F9"/>
    <circle cx="105" cy="85" r="19" fill="#16C5E8"/>
    <circle cx="148" cy="85" r="19" fill="#FFD000"/>

    <!-- Middle Row -->
    <circle cx="62" cy="126" r="19" fill="#8245E8"/>
    <circle cx="105" cy="126" r="19" fill="#FFFFFF"
            stroke="#CCCCCC" stroke-width="1"/>
    <circle cx="148" cy="126" r="19" fill="#FF7900"/>

    <!-- Bottom Row -->
    <circle cx="62" cy="167" r="19" fill="#16C65A"/>
    <circle cx="105" cy="167" r="19" fill="#70DD32"/>
    <circle cx="148" cy="167" r="19" fill="#F34D91"/>
  </g>

  <!-- Vertical Divider -->
  <rect x="200" y="85" width="3" height="84"
        fill="#111111"/>

  <!-- Brand Name -->
  <text x="229"
        y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="700"
        letter-spacing="-2.5"
        fill="#050505">
    The Managing Co
  </text>

  <!-- Yellow Brand Accent -->
  <circle cx="770" cy="137" r="8"
          fill="#FFD000"/>

</svg>
