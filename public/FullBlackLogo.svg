
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="256"
     viewBox="0 0 1024 256">

  <!-- Black Background -->
  <rect width="1024" height="256" fill="#000000"/>

  <!-- 3x3 Dot Icon -->
  <g>
    <!-- Row 1 -->
    <circle cx="124" cy="69" r="19" fill="#0878F9"/>
    <circle cx="167" cy="69" r="19" fill="#20C5E8"/>
    <circle cx="210" cy="69" r="19" fill="#FFD000"/>

    <!-- Row 2 -->
    <circle cx="124" cy="111" r="19" fill="#8145E8"/>
    <circle cx="167" cy="111" r="19" fill="#FFFFFF"/>
    <circle cx="210" cy="111" r="19" fill="#FF7900"/>

    <!-- Row 3 -->
    <circle cx="124" cy="153" r="19" fill="#16C65A"/>
    <circle cx="167" cy="153" r="19" fill="#70DD32"/>
    <circle cx="210" cy="153" r="19" fill="#F34D91"/>
  </g>

  <!-- Vertical Divider -->
  <rect x="260" y="67" width="3" height="87"
        rx="1" fill="#777777"/>

  <!-- Brand Name -->
  <text x="290" y="126"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="700"
        letter-spacing="-2.5">
    The Managing Co
  </text>

  <!-- Yellow Brand Dot -->
  <circle cx="830" cy="119" r="7.5" fill="#FED10B"/>

</svg>
